name: people

on:
  schedule:
    # Daily 06:30 UTC, after the 05:00 refresh, so "in band" is today's answer.
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: people
  cancel-in-progress: false

jobs:
  people:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Find the talent and people team at in-band prospects
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
        run: npm run people
