name: triggers

on:
  schedule:
    # Daily, 07:15 UTC. The refresh starts at 05:00 and takes about 1h50m over the full
    # list, so this leaves it roughly 25 minutes of headroom to finish first. Triggers
    # read the snapshots the refresh writes, so the order matters more than the hour.
    - cron: '15 7 * * *'
  workflow_dispatch:

concurrency:
  group: triggers
  cancel-in-progress: false

jobs:
  triggers:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Evaluate triggers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run triggers

      # The Clay push and the Slack digest used to run here. Both are now decided
      # against: Clay was dropped on 2026-10-01 once the console took over segmentation
      # and Exa took over contact discovery, and the digest was never wanted. The code
      # and the npm scripts are kept (`npm run clay`, `npm run digest`) so either can be
      # re-added in one step, but neither belongs on a schedule for a decision we have
      # already taken the other way.
