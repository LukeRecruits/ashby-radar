name: discovery

on:
  schedule:
    # Weekly, Sunday 03:00 UTC. Well clear of the daily 05:00 refresh.
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: discovery
  cancel-in-progress: false

jobs:
  discovery:
    runs-on: ubuntu-latest
    # Crawl index sweeps are slow by design: 1 request per 1.2s across six indexes.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Run discovery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run discovery
